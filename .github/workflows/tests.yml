name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run tests
        run: python -m pytest -q

  update-e2e:
    name: Upgrade E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - name: Install test and build dependencies
        run: python -m pip install -e ".[dev]" build setuptools wheel
      - name: Test real pip and uv upgrades in a terminal
        env:
          LLAMASTUDIO_UPDATE_E2E: "1"
        run: python -m pytest tests/test_update_e2e.py -v --basetemp=.runtime/update-e2e

  inference-e2e:
    name: Inference setup E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl pytest
      - name: Test setup and launcher behavior on the native platform
        env:
          LLAMASTUDIO_CONFIG_DIR: ${{ runner.temp }}/inference-tests/config
          LLAMASTUDIO_MODEL_PROFILES_FILE: ${{ runner.temp }}/inference-tests/profiles.json
          LLAMASTUDIO_LOG_DIR: ${{ runner.temp }}/inference-tests/logs
        run: python -m pytest tests/test_inference_setup.py tests/test_launcher.py tests/test_tui_setup.py tests/test_process_ownership.py tests/test_launcher_package.py -q
      - name: Test a real managed engine from the installed wheel
        env:
          LLAMASTUDIO_INFERENCE_E2E: "1"
        run: python -m pytest tests/test_inference_e2e.py -v

  jest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run frontend tests
        run: |
          npm test
